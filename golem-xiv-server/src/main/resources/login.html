<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golem XIV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/css/beercss.css">
    <link rel="stylesheet" href="/css/main.css">
    <script type="module" src="/css/beercss.js"></script>
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 380px;
        }
        .login-card h5 {
            letter-spacing: 4px;
            text-align: center;
        }
        .error {
            display: none;
        }
    </style>
</head>
<body class="dark">
<script type="x-shader/x-fragment" id="image">
    precision highp float;

    uniform vec2  iResolution;
    uniform float iTime;
    uniform float iScroll;
    uniform float iInvert;

    #define rot(a) mat2(cos(a + vec4(0,33,11,0)))
    #define C(U,w) smoothstep( w, -w, sin(length(fract(U)*2.-1.) * 3.) *.5  -.118 )
    #define O gl_FragColor

    void main() {
    vec2 u = gl_FragCoord.xy;
    vec2  R = iResolution.xy, P,
          U = ( u+u - R ) / min(R.x, R.y) * .5;
    float d = length(U),
          t = iTime,
          blur = .4 + sin(t * .52) * .2,
          luma = .5,
          abber = .01;
    U *= rot( sin(t * .14) * .3 )
       * (sin(t * .15) + 2.) * .3;
    U *= log(length(U)*.428) * 1.1;

    for (float i = 0.; i < 3.; i++) {
        P = U + vec2(sin(t*.12), cos(t*.13));
        P.y -= iScroll;

        O.rgb += vec3(
            C( P - U * abber, blur),
            C( P, blur),
            C( P + U * abber, blur)
        ) * luma;
        O = min(O,1.);
        U *= ( 1.1 + C(P,.04) * 1.2 )
          *   rot( sin(t*.05) * 1.33 );
        luma *= .6;
        blur *= .63;
    }

    vec3 C = 1.+mix(  sin(t * vec3(1.13,1.23,1.33) * .3),
                    - sin(t * vec3(1.43,1.53,1.63) * .3), d-.5) *.4*vec3(1,1,-1);
    O = vec4(pow(O.rgb, C), 1) * smoothstep(2.1, .7, d / .5);
    O = O * O;
    O.rgb = pow(O.rgb, vec3(1.0 - iInvert));
}
</script>
<script src="/js/shader-web-background.js"></script>
<script>
    const randomSeed = Math.random() * 100;
    let time = randomSeed;
    let lastFrameTime = performance.now();
    shaderWebBackground.shade((ctx) => ({
      onResize: (width, height) => {},
      onBeforeFrame: () => {
        const now = performance.now();
        const delta = (now - lastFrameTime) / 5000;
        lastFrameTime = now;
        time += delta;
      },
      shaders: {
        image: {
          uniforms: {
            iResolution: () => ctx.resolution,
            iTime:       () => time,
            iScroll:     () => 0,
            iInvert:     () => 0,
          }
        }
      }
    }));
</script>
<div class="login-container">
    <article class="login-card surface-container round extra-elevate large-padding">
        <h5>Golem XIV</h5>
        <div class="space"></div>
        <p class="error center-align" id="error">
            <span>Invalid password</span>
        </p>
        <form method="POST" action="/login">
            <input type="hidden" name="username" value="golem">
            <div class="field label border round">
                <input type="password" name="password" id="password" autofocus required>
                <label for="password">Password</label>
            </div>
            <div class="space"></div>
            <button type="submit" class="responsive round">
                <span>Enter</span>
            </button>
        </form>
    </article>
</div>
<script>
    if (new URLSearchParams(window.location.search).has('error')) {
        document.getElementById('error').style.display = 'block';
    }
</script>
</body>
</html>
